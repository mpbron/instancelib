[project]
name = "instancelib"
version = "0.6.0"
description = "A generic interface for datasets and Machine Learning models"
readme = "README.md"
license = { text = "GNU LGPL v3" }
authors = [
    { name = "Michiel Bron", email = "m.p.bron@uu.nl" },
]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "pandas",
    "h5py",
    "scikit-learn",
    "openpyxl",
    "xlrd",
    "tqdm",
    "more-itertools",
    "typing_extensions",
]

[project.optional-dependencies]
doc2vec = ["gensim"]
hdf5 = ["tables"]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["instancelib"]
